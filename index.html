<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kondensator-Labor VR</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#dfe5eb;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#15212e;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #d4dae1;z-index:5}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand span{font-size:12px;color:#5a6775}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.b{height:36px;padding:0 12px;border-radius:8px;border:1px solid #d4dae1;background:#fff;font:600 13px system-ui,-apple-system,sans-serif;color:#15212e;cursor:pointer}
.b.primary{background:#15212e;color:#fff;border-color:#15212e}
.b[aria-pressed="true"]{background:#f7ead6;border-color:#b06f16;color:#6b420b}
#help{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);background:rgba(21,33,46,.86);color:#fff;font-size:12.5px;padding:7px 14px;border-radius:16px;max-width:92vw;text-align:center;z-index:5;pointer-events:none}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#c2491b;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;max-width:86vw;text-align:center;z-index:8;display:none}
#exit{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);z-index:6;opacity:.75;display:none}
#rotate{position:fixed;inset:0;display:none;place-items:center;background:#15212e;color:#fff;font-size:20px;z-index:7;text-align:center;padding:24px}
body.stereo #ui,body.stereo #help{display:none}
body.stereo #exit{display:block}
body.stereo.portrait #rotate{display:grid}
@media (max-width:520px){.brand span{display:none}.b{height:34px;padding:0 10px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="ui">
  <div class="brand"><b>Kondensator-Labor VR</b><span>Wovon hängt die Kapazität ab? Experimentell bestimmen.</span></div>
  <div class="btns">
    <button class="b primary" id="btnXR" type="button" hidden>VR-Brille starten</button>
    <button class="b primary" id="btnCardboard" type="button">Cardboard</button>
    <button class="b" id="btnGyro" type="button" aria-pressed="false">Bewegungssensor</button>
    <button class="b" id="btnCenter" type="button">Nach vorn</button>
  </div>
</div>
<div id="help">Wischen: umsehen · Tippen: bedienen · links Steuerung, rechts Messreihe</div>
<div id="toast"></div>
<button class="b" id="exit" type="button">Cardboard beenden</button>
<div id="rotate"><div>Handy quer halten<br><small style="font-size:14px;opacity:.75">und in die Cardboard-Brille stecken</small></div></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { StereoEffect } from 'three/addons/effects/StereoEffect.js';

// ------------------------------------------------------------ Grundlagen
const $ = s => document.querySelector(s);
const v = (x, y, z) => new THREE.Vector3(x, y, z);
const EPS0 = 8.854e-12;
const SLAB_T = 1.0; // Dicke der Isolierplatte in cm
const nf = (x, d = 1) => x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const gauss = () => { let u = 0, w = 0; while (!u) u = Math.random(); while (!w) w = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * w); };
const SANS = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace';
const INK = '#15212e', MUTED = '#5a6775', LINE = '#d4dae1', BRASS = '#b06f16', BRASS_SOFT = '#f7ead6', OKC = '#2c8549', WARN = '#c2491b', PAPER = '#f3f5f7';

const MEDIA = {
  air: { name: 'Luft', er: 1.0 },
  plexi: { name: 'Plexiglas', er: 3.3 },
  glass: { name: 'Glas', er: 6.0 },
};
const MODES = {
  QU: { tab: 'Q(U)', fixed: ['d', 'r', 'med'], hint: 'Nur U ändern, d, r und Material gleich lassen. Ist Q proportional zu U? Die Steigung ist C.' },
  Cd: { tab: 'C(d)', fixed: ['r', 'med'], hint: 'Nur den Abstand d ändern, r und Material gleich lassen. Wie hängt C von d ab?' },
  CA: { tab: 'C(A)', fixed: ['d', 'med'], hint: 'Nur den Plattenradius ändern, d und Material gleich lassen. Wie hängt C von A ab?' },
  Ce: { tab: 'C(εᵣ)', fixed: ['d', 'r'], hint: 'd = 1,0 cm (Plattendicke) einstellen, dann je einmal mit Luft, Plexiglas und Glas messen.' },
};
const FIXNAME = { d: 'der Abstand d', r: 'der Radius r', med: 'das Material' };
const fixVal = (k, p) => k === 'd' ? nf(p.d) + ' cm' : k === 'r' ? nf(p.r) + ' cm' : MEDIA[p.med].name;

// ------------------------------------------------------------ Zustand
const st = {
  U: 1.0, d: 2.0, r: 10, med: 'air', sw: 'messen', real: false,
  Qvis: 0, t0: 0, Qm: 0, Qshow: 0, meter: null,
  mode: 'Cd', xInv: false,
  msg: 'Willkommen! Links stellst du ein, rechts wählst du die Messreihe. Ablauf: Laden → Messen → Messwert speichern.', msgKind: '',
};
const series = { QU: [], Cd: [], CA: [], Ce: [] };

function capPF(p = st) {
  const r = p.r / 100, d = p.d / 100, t = SLAB_T / 100, A = Math.PI * r * r, er = MEDIA[p.med].er;
  const dEff = p.med === 'air' ? d : (d - t) + t / er;
  let C = EPS0 * A / dEff;
  if (p.real) C += EPS0 * r * (Math.log(16 * Math.PI * r / d) - 1) + 4e-12; // Randfeld (Kirchhoff) + Kabel/Halterung
  return C * 1e12;
}

// ------------------------------------------------------------ Renderer & Szene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.setReferenceSpaceType('local');
document.body.prepend(renderer.domElement);
const stereo = new StereoEffect(renderer);
stereo.setEyeSeparation(0.064);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe5eb);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 60);
scene.add(camera);
const world = new THREE.Group();
world.position.y = -1.6; // Augenhöhe 1,6 m; die Kamera bleibt im Ursprung
scene.add(world);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8792a0, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(0.7, 1.7, 0.5); scene.add(sun);
sun.target.position.set(0, -0.7, -0.85); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.015;
Object.assign(sun.shadow.camera, { left: -1.1, right: 1.1, top: 1.1, bottom: -1.1, near: 0.1, far: 6 });
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.4); fill.position.set(-2, 1.5, 1); scene.add(fill);

// ------------------------------------------------------------ Materialien & Helfer
function signTexture(sign) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = sign > 0 ? '#d23b2f' : '#2762c6';
  g.beginPath(); g.arc(32, 32, 27, 0, Math.PI * 2); g.fill();
  g.lineWidth = 4; g.strokeStyle = 'rgba(255,255,255,.9)'; g.stroke();
  g.fillStyle = '#fff'; g.fillRect(18, 28.5, 28, 7); if (sign > 0) g.fillRect(28.5, 18, 7, 28);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const M = {
  bench: new THREE.MeshStandardMaterial({ color: 0x2c333b, roughness: 0.78 }),
  benchTrim: new THREE.MeshStandardMaterial({ color: 0x9aa4ae, metalness: 0.6, roughness: 0.35 }),
  benchEdge: new THREE.MeshStandardMaterial({ color: 0x1f252b, roughness: 0.6 }),
  floor: new THREE.MeshStandardMaterial({ color: 0xa3acb6, roughness: 0.95 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xeef1f4, roughness: 1 }),
  alu: new THREE.MeshStandardMaterial({ color: 0xd6dade, metalness: 1, roughness: 0.3 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xb9bec4, metalness: 1, roughness: 0.25 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xcaa04a, metalness: 1, roughness: 0.3 }),
  castIron: new THREE.MeshStandardMaterial({ color: 0x3a4149, metalness: 0.5, roughness: 0.5 }),
  ebonite: new THREE.MeshStandardMaterial({ color: 0x18191b, roughness: 0.45 }),
  casing: new THREE.MeshStandardMaterial({ color: 0xd8dde2, roughness: 0.5 }),
  casingBase: new THREE.MeshStandardMaterial({ color: 0x55606b, roughness: 0.5 }),
  front: new THREE.MeshStandardMaterial({ color: 0x1d242b, roughness: 0.5 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xe0a21e, roughness: 0.4 }),
  casing2: new THREE.MeshStandardMaterial({ color: 0xe9ecef, roughness: 0.5 }),
  insul: new THREE.MeshPhysicalMaterial({ color: 0xa93421, roughness: 0.15, transparent: true, opacity: 0.9, clearcoat: 1 }),
  red: new THREE.MeshStandardMaterial({ color: 0xcf3a2e, roughness: 0.4 }),
  blue: new THREE.MeshStandardMaterial({ color: 0x2560c4, roughness: 0.4 }),
  knob: new THREE.MeshStandardMaterial({ color: 0xcf3a2e, roughness: 0.35 }),
  pick: new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false }),
};
const plusMat = new THREE.SpriteMaterial({ map: signTexture(1) });
const minusMat = new THREE.SpriteMaterial({ map: signTexture(-1) });
const slabMats = {
  plexi: new THREE.MeshPhysicalMaterial({ color: 0xdff3f6, roughness: 0.05, transparent: true, opacity: 0.45, clearcoat: 1, depthWrite: false }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x8fd3be, roughness: 0.03, transparent: true, opacity: 0.5, clearcoat: 1, depthWrite: false }),
};
const fieldMat = new THREE.MeshBasicMaterial({ color: 0xe39a1c, transparent: true, opacity: 0.8, depthWrite: false });

const mesh = (geo, mat) => { const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = true; return m; };
const flat = m => { m.castShadow = m.receiveShadow = false; return m; };
const cyl = (rt, rb, h, mat, seg = 24) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
const box = (w, h, d, mat) => mesh(new THREE.BoxGeometry(w, h, d), mat);
const sph = (r, mat) => mesh(new THREE.SphereGeometry(r, 20, 14), mat);
function put(parent, m, x, y, z) { m.position.set(x, y, z); parent.add(m); return m; }
function rod(a, b, r, mat) {
  const dir = b.clone().sub(a), len = dir.length();
  const m = cyl(r, r, len, mat, 12);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(v(0, 1, 0), dir.normalize());
  return m;
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function lines(g, text, maxW) {
  const out = []; let line = '';
  for (const w of text.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out;
}
function wrap(g, text, x, y, maxW, lh, maxLines = 3) {
  lines(g, text, maxW).slice(0, maxLines).forEach((l, i) => g.fillText(l, x, y + i * lh));
}

// Textflächen (Canvas → Textur)
function canvasPlane(wm, hm, pw, ph, draw, transparent = false) {
  const cv = document.createElement('canvas'); cv.width = pw; cv.height = ph;
  const g = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = maxAniso;
  const m = flat(mesh(new THREE.PlaneGeometry(wm, hm), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, transparent })));
  const obj = { mesh: m, g, pw, ph, redraw() { g.clearRect(0, 0, pw, ph); draw(g, pw, ph); tex.needsUpdate = true; } };
  obj.redraw(); return obj;
}

// ------------------------------------------------------------ Raum & Tisch
{
  const floor = mesh(new THREE.PlaneGeometry(10, 10), M.floor); floor.rotation.x = -Math.PI / 2; world.add(floor);
  const wall = mesh(new THREE.PlaneGeometry(10, 4), M.wall); wall.position.set(0, 2, -2.4); world.add(wall);
  for (const sx of [-1, 1]) { const w = mesh(new THREE.PlaneGeometry(6, 4), M.wall); w.rotation.y = -sx * Math.PI / 2; w.position.set(sx * 3, 2, 0.4); world.add(w); }
  put(world, box(1.9, 0.036, 0.75, M.bench), 0, 0.882, -0.85);
  put(world, box(1.912, 0.012, 0.762, M.benchTrim), 0, 0.858, -0.85);
  put(world, box(1.86, 0.1, 0.72, M.benchEdge), 0, 0.8, -0.85);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) put(world, box(0.05, 0.76, 0.05, M.benchEdge), sx * 0.9, 0.38, -0.85 + sz * 0.32);
}

// ------------------------------------------------------------ Plattenkondensator
const capG = new THREE.Group(); capG.position.set(0.02, 0.9, -0.86); capG.rotation.y = -0.35; world.add(capG);
put(capG, box(0.52, 0.012, 0.045, M.alu), 0, 0.006, 0); // Schiene

class Plate {
  constructor(side) {
    this.side = side; this.group = new THREE.Group(); capG.add(this.group);
    const sx = side * 0.035;
    put(this.group, box(0.05, 0.012, 0.06, M.castIron), sx, 0.018, 0);
    put(this.group, cyl(0.008, 0.008, 0.19, M.insul, 16), sx, 0.119, 0);
    put(this.group, box(0.02, 0.022, 0.02, M.alu), sx, 0.245, 0);
    this.group.add(rod(v(sx, 0.25, 0), v(0, 0.25, 0), 0.004, M.steel));
    put(this.group, cyl(0.005, 0.005, 0.014, side < 0 ? M.red : M.blue, 12), sx, 0.262, 0);
    this.term = new THREE.Object3D(); this.term.position.set(sx, 0.27, 0); this.group.add(this.term);
    this.mat = M.alu.clone();
    this.charges = new THREE.Group(); this.group.add(this.charges);
    this.sprites = [];
    for (let i = 0; i < 48; i++) { const s = new THREE.Sprite(side < 0 ? plusMat : minusMat); s.visible = false; s.raycast = () => {}; this.charges.add(s); this.sprites.push(s); }
  }
  setR(rcm) {
    const r = rcm / 100;
    if (this.disk) { this.group.remove(this.disk, this.rim); this.disk.geometry.dispose(); this.rim.geometry.dispose(); }
    this.disk = cyl(r, r, 0.003, this.mat, 64); this.disk.rotation.z = Math.PI / 2; this.disk.position.set(0, 0.25, 0);
    this.rim = mesh(new THREE.TorusGeometry(r, 0.002, 8, 64), this.mat); this.rim.rotation.y = Math.PI / 2; this.rim.position.set(0, 0.25, 0);
    this.group.add(this.disk, this.rim);
    const N = this.sprites.length, sc = clamp(r * 0.11, 0.008, 0.014);
    this.sprites.forEach((s, i) => {
      const rr2 = r * 0.85 * Math.sqrt((i + 0.5) / N), th = i * 2.39996;
      s.position.set(-this.side * 0.006, 0.25 + rr2 * Math.sin(th), rr2 * Math.cos(th)); s.scale.set(sc, sc, 1);
    });
  }
  setX(x) { this.group.position.x = x; }
}
const plateL = new Plate(-1), plateR = new Plate(1);

const fieldG = new THREE.Group(); fieldG.position.set(0, 0.25, 0); capG.add(fieldG);
let slab = null;
function rebuildField() {
  fieldG.children.forEach(c => c.geometry.dispose()); fieldG.clear();
  const d = st.d / 100, r = st.r / 100;
  const lineGeo = new THREE.CylinderGeometry(0.0012, 0.0012, Math.max(0.001, d - 0.006), 6); lineGeo.rotateZ(Math.PI / 2);
  const coneGeo = new THREE.ConeGeometry(0.0042, 0.011, 10); coneGeo.rotateZ(-Math.PI / 2);
  for (let i = 0; i < 19; i++) {
    const rr2 = r * 0.75 * Math.sqrt((i + 0.5) / 19), th = i * 2.39996;
    put(fieldG, flat(mesh(lineGeo, fieldMat)), 0, rr2 * Math.sin(th), rr2 * Math.cos(th));
    if (st.d >= 1.5 && st.med === 'air') put(fieldG, flat(mesh(coneGeo, fieldMat)), 0, rr2 * Math.sin(th), rr2 * Math.cos(th));
  }
  if (slab) { capG.remove(slab); slab.geometry.dispose(); slab = null; }
  if (st.med !== 'air') {
    const t = SLAB_T / 100 - 0.0006, s = r * 2.2;
    slab = flat(mesh(new THREE.BoxGeometry(t, s, s), slabMats[st.med]));
    slab.position.set(-d / 2 + SLAB_T / 200, 0.25, 0); // liegt an der Plusplatte an
    capG.add(slab);
  }
}
const dLabel = canvasPlane(0.13, 0.04, 320, 98, (g, w, h) => {
  rr(g, 3, 3, w - 6, h - 6, 18); g.fillStyle = 'rgba(255,255,255,.95)'; g.fill(); g.strokeStyle = LINE; g.lineWidth = 3; g.stroke();
  g.fillStyle = INK; g.font = `600 52px ${MONO}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('d = ' + nf(st.d) + ' cm', w / 2, h / 2 + 2);
}, true);
const dSprite = dLabel.mesh; world.add(dSprite);

// ------------------------------------------------------------ Geräteschilder
function pill(text, wm, x, y, z) {
  const o = canvasPlane(wm, wm * 96 / 512, 512, 96, (g, w, h) => {
    g.font = `600 46px ${SANS}`; const tw = Math.min(w - 8, g.measureText(text).width + 60);
    rr(g, (w - tw) / 2, 8, tw, h - 16, (h - 16) / 2); g.fillStyle = 'rgba(21,33,46,.9)'; g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 2);
  }, true);
  o.mesh.position.set(x, y, z); world.add(o.mesh); return o;
}
function socket(parent, x, y, z, mat, back = false) {
  const s = cyl(0.0085, 0.0085, 0.012, mat, 16); s.rotation.x = Math.PI / 2; put(parent, s, x, y, back ? z - 0.004 : z + 0.004);
  const o = new THREE.Object3D(); o.position.set(x, y, back ? z - 0.01 : z + 0.01); parent.add(o); return o;
}

// ------------------------------------------------------------ Netzgerät
const supply = new THREE.Group(); supply.position.set(-0.52, 0.9, -1.0); world.add(supply);
put(supply, box(0.28, 0.14, 0.2, M.casing), 0, 0.08, 0);
put(supply, box(0.284, 0.012, 0.204, M.casingBase), 0, 0.006, 0);
put(supply, box(0.26, 0.12, 0.004, M.front), 0, 0.08, 0.1);
const supDisp = canvasPlane(0.13, 0.05, 320, 124, (g, w, h) => {
  g.fillStyle = '#1a0d0b'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ff5a3c'; g.font = `600 64px ${MONO}`; g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText(nf(st.U, 2), w - 86, h / 2 + 4);
  g.font = `600 40px ${SANS}`; g.textAlign = 'left'; g.fillText('kV', w - 80, h / 2 + 6);
});
put(supply, supDisp.mesh, -0.045, 0.105, 0.1026);
{ const k = cyl(0.017, 0.017, 0.016, M.casing, 24); k.rotation.x = Math.PI / 2; put(supply, k, 0.08, 0.105, 0.108); }
const supPlus = socket(supply, 0.04, 0.042, 0.102, M.red);
const supMinusB = socket(supply, 0.09, 0.042, -0.1, M.blue, true);
const supTags = canvasPlane(0.1, 0.018, 400, 72, (g, w, h) => { g.fillStyle = '#c9d2dc'; g.font = `600 44px ${SANS}`; g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillText('+  Ausgang', w / 2, h / 2); }, true);
put(supply, supTags.mesh, 0.06, 0.066, 0.1026);
pill('Netzgerät', 0.2, -0.52, 1.095, -1.0);

// ------------------------------------------------------------ Umschalter
const sw = new THREE.Group(); sw.position.set(-0.3, 0.9, -0.68); world.add(sw);
put(sw, box(0.12, 0.03, 0.075, M.front), 0, 0.015, 0);
put(sw, cyl(0.007, 0.007, 0.006, M.brass, 12), -0.035, 0.033, -0.012);
put(sw, cyl(0.007, 0.007, 0.006, M.brass, 12), 0.035, 0.033, -0.012);
const lever = new THREE.Group(); lever.position.set(0, 0.03, -0.012); sw.add(lever);
put(lever, cyl(0.004, 0.004, 0.07, M.steel, 12), 0, 0.035, 0);
const leverKnob = put(lever, sph(0.011, M.knob.clone()), 0, 0.072, 0);
const swLbl = canvasPlane(0.12, 0.024, 600, 120, (g, w, h) => {
  g.fillStyle = '#fff'; g.font = `700 54px ${SANS}`; g.textBaseline = 'middle';

let mode = 'touch'; // touch | stereo | xr

const dwell = { key: null, t: 0, fired: false };

const reticle = new THREE.Group(); reticle.renderOrder = 999; scene.add(reticle);
const retMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true });
const retEdge = new THREE.MeshBasicMaterial({ color: 0x15212e, depthTest: false, transparent: true, opacity: 0.7 });

let progStep = -1;
function setProgress(k) {
  const step = Math.round(clamp(k, 0, 1) * 32);

  progMesh.visible = step > 0;
  if (step > 0) { progMesh.geometry.dispose(); const len = step / 32 * Math.PI * 2; progMesh.geometry = new THREE.RingGeometry(0.016, 0.023, 32, 1, Math.PI / 2 - len, len); }

function updateInteraction(dt) {
  let have = false;
  if (mode === 'xr' && xrPointer) { rOrigin.setFromMatrixPosition(xrPointer.matrixWorld); rDir.set(0, 0, -1).transformDirection(xrPointer.matrixWorld); have = true; }
  else if (isGaze()) { camera.getWorldPosition(rOrigin); camera.getWorldDirection(rDir); have = true; }
  else if (mouse.on) { raycaster.setFromCamera(mouse.ndc, camera); rOrigin.copy(raycaster.ray.origin); rDir.copy(raycaster.ray.direction); have = true; }
  const showRet = isGaze() || (mode === 'xr' && xrPointer);

  const hit = castRay(), h = resolve(hit);

    const dist = hit ? hit.distance - 0.01 : 1.5;

}

$('#btnCenter').addEventListener('click', () => { yaw = 0; pitch = -0.32; gyro.calibrated = false; });

if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (ok) $('#btnXR').hidden = false; }).catch(() => {});
}
$('#btnXR').addEventListener('click', async () => {
  ensureAudio();
  try {
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
    await renderer.xr.setSession(session);
    mode = 'xr'; document.body.classList.add('stereo'); $('#exit').style.display = 'none';
    say('VR: Ziel anvisieren und kurz warten oder antippen.');
    session.addEventListener('end', () => {
      mode = 'touch'; xrPointer = null; document.body.classList.remove('stereo'); $('#exit').style.display = '';
      camera.position.set(0, 0, 0); resize();
    });
  } catch (e) { toast('VR konnte nicht gestartet werden.'); }
});
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i); scene.add(c);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([v(0, 0, 0), v(0, 0, -1.2)]), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }));
  line.visible = false; c.add(line);
  c.addEventListener('connected', e => {
    c.userData.mode = e.data.targetRayMode;
    if (e.data.targetRayMode === 'tracked-pointer') { line.visible = true; if (!xrPointer) xrPointer = c; }
  });
  c.addEventListener('disconnected', () => { line.visible = false; if (xrPointer === c) xrPointer = null; c.userData.mode = null; });
  c.addEventListener('select', () => {
    if (c.userData.mode === 'tracked-pointer' && xrPointer !== c) { xrPointer = c; updateInteraction(0); }
    activate(hover);
  });
}

// ------------------------------------------------------------ Darstellung pro Frame
let meterDrawn = -1;
function updateVisuals(dt) {
  if (st.sw === 'laden') st.Qvis = chargeNow();
  st.Qshow += (st.Qm - st.Qshow) * Math.min(1, dt * 7);
  if (Math.abs(st.Qshow - st.Qm) < 0.02) st.Qshow = st.Qm;
  if (Math.abs(st.Qshow - meterDrawn) > 0.04 || (st.Qshow === 0 && meterDrawn !== 0)) { meterDrawn = st.Qshow; meterDisp.redraw(); }
  const sigma = st.Qvis / (Math.PI * st.r * st.r); // nC/cm²
  const frac = clamp(sigma / 0.15, 0, 1), n = Math.round(48 * frac);
  for (const p of [plateL, plateR]) {
    p.sprites.forEach((s, i) => { s.visible = i < n; });
    p.mat.emissive.setHex(p.side < 0 ? 0xcf3a2e : 0x2560c4); p.mat.emissiveIntensity = frac * 0.4;
  }
  fieldG.visible = frac > 0.01; fieldMat.opacity = 0.15 + 0.7 * Math.sqrt(frac);
  const target = st.sw === 'laden' ? 0.6 : -0.6;
  lever.rotation.z += (target - lever.rotation.z) * Math.min(1, dt * 12);
}

function resize() {
  if (renderer.xr.isPresenting) return;
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = mode === 'stereo' ? 80 : (h > w ? 78 : 62);
  camera.updateProjectionMatrix();
  if (mode === 'stereo') stereo.setSize(w, h);
  document.body.classList.toggle('portrait', h > w);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

// ------------------------------------------------------------ Start
st.U = 1.0;
plateL.setR(st.r); plateR.setR(st.r);
applyGeometry(false);
resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  updateOrientation();
  updateInteraction(dt);
  updateVisuals(dt);
  for (const p of panels) if (p.dirty) p.render();
  if (mode === 'stereo') stereo.render(scene, camera); else renderer.render(scene, camera);
});
</script>
</body>
